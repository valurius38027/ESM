name: Materialize Phase 3 Source

on:
  pull_request:
    branches: [agent/phase2-experimental-controls]

permissions:
  contents: write

concurrency:
  group: materialize-phase3-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.head_ref == 'agent/phase3-credit-assignment'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase3-credit-assignment
          fetch-depth: 0
      - name: Reassemble and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .phase3-bootstrap/part-00 \
              .phase3-bootstrap/part-01 \
              .phase3-bootstrap/part-02 \
              .phase3-bootstrap/part-03 \
              .phase3-bootstrap/part-04 > /tmp/phase3.tar.gz.b64
          echo 'b36f7a448688f9e42c6039ac9d3ace95b9a4d49d0702aac0f8408a702bc5ef65  /tmp/phase3.tar.gz.b64' | sha256sum --check
          base64 --decode /tmp/phase3.tar.gz.b64 > /tmp/phase3.tar.gz
          echo '6eaf0aadb811d46cd48d825635e5b4be01cb6e6039b9481ae801054e42ed9ee3  /tmp/phase3.tar.gz' | sha256sum --check
          tar -tzf /tmp/phase3.tar.gz
          tar -xzf /tmp/phase3.tar.gz -C .
      - name: Commit materialized Phase 3 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .phase3-bootstrap
          rm -f .github/workflows/phase3-experiments.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Materialization produced no changes.' >&2
            exit 1
          fi
          git commit -m 'feat: add phase 3 credit assignment source'
          git push origin HEAD:agent/phase3-credit-assignment
