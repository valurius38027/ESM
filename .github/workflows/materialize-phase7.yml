name: Materialize Phase 7 Source

on:
  pull_request:
    branches: [agent/phase5-calibration]

permissions:
  contents: write

concurrency:
  group: materialize-phase7-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.head_ref == 'agent/phase7-learned-slot-routing'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase7-learned-slot-routing
          fetch-depth: 0
      - name: Reassemble and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .phase7-bootstrap/part-00 \
            .phase7-bootstrap/part-01 \
            .phase7-bootstrap/chunk-04 \
            .phase7-bootstrap/chunk-05 \
            .phase7-bootstrap/chunk-06 \
            > /tmp/phase67.patch.gz.b64
          echo 'd864d09597bda929def6eea5648bd25178d16e608c259513c35e8b006bb67601  /tmp/phase67.patch.gz.b64' | sha256sum --check
          base64 --decode /tmp/phase67.patch.gz.b64 > /tmp/phase67.patch.gz
          echo 'be3a79171a400d90c6c8dcb95e07ebbb0572587da725093013c476662b719017  /tmp/phase67.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/phase67.patch.gz > /tmp/phase67.patch
          echo 'e91851dafa86a74f4dc3080b6fcd23965add2a60e37baa62fa5081257a773d9d  /tmp/phase67.patch' | sha256sum --check
          git apply --check /tmp/phase67.patch
      - name: Apply and commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/phase67.patch
          rm -rf .phase7-bootstrap
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add Phase 6 and Phase 7 sparse key value experiments'
          git push origin HEAD:agent/phase7-learned-slot-routing
