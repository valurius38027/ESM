name: Materialize Phase 2 Results

on:
  push:
    branches: [agent/phase2-results-staging]

permissions:
  contents: write
  actions: read

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Download verified formal artifact
        uses: actions/download-artifact@v4
        with:
          name: phase2-formal-results
          path: /tmp/phase2-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: valurius38027/ESM
          run-id: 29437371946
      - name: Copy full consolidated data and verify
        run: |
          cp /tmp/phase2-artifact/phase2-formal/phase2_runs.csv results/phase2-formal/
          cp /tmp/phase2-artifact/phase2-formal/phase2_causal.csv results/phase2-formal/
          cd results/phase2-formal
          sha256sum --check SHA256SUMS
      - name: Commit materialized results
        run: |
          rm .github/workflows/materialize-phase2-results.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f results/phase2-formal/phase2_runs.csv \
                     results/phase2-formal/phase2_causal.csv
          git add -A .github/workflows/materialize-phase2-results.yml
          git commit -m 'results: materialize phase 2 formal data'
          git push origin HEAD
