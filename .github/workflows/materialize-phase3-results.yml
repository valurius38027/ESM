name: Materialize Phase 3 Results

on:
  pull_request:
    branches: [agent/phase2-experimental-controls]

permissions:
  actions: read
  contents: write

concurrency:
  group: materialize-phase3-results-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.head_ref == 'agent/phase3-credit-assignment'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase3-credit-assignment
          fetch-depth: 0
      - name: Download and verify formal artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output /tmp/phase3-formal-results.zip \
            'https://api.github.com/repos/valurius38027/ESM/actions/artifacts/8354069242/zip'
          echo 'a8914dca32fe569c4ac06dd5ba9a7fcd061065e6325a5942d6833064327f0b75  /tmp/phase3-formal-results.zip' | sha256sum --check
          rm -rf /tmp/phase3-artifact
          mkdir -p /tmp/phase3-artifact
          unzip -q /tmp/phase3-formal-results.zip -d /tmp/phase3-artifact
          cd /tmp/phase3-artifact/phase3-formal
          sha256sum --check SHA256SUMS
          cd "${GITHUB_WORKSPACE}"
          rm -rf results/phase3-formal
          mkdir -p results/phase3-formal
          cp -a /tmp/phase3-artifact/phase3-formal/. results/phase3-formal/
      - name: Commit verified consolidated results
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f results/phase3-formal
          if git diff --cached --quiet; then
            echo 'No Phase 3 result changes to commit.' >&2
            exit 1
          fi
          git commit -m 'results: add phase 3 formal artifact'
          git push origin HEAD:agent/phase3-credit-assignment
