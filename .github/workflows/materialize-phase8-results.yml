name: Materialize Phase 8 Results

on:
  pull_request:
    branches: [agent/phase7-learned-slot-routing]

permissions:
  contents: write

concurrency:
  group: materialize-phase8-results-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.head_ref == 'agent/phase8-retention-eviction'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase8-retention-eviction
          fetch-depth: 0
      - name: Download and verify formal artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/valurius38027/ESM/actions/artifacts/8398546609/zip \
            --output /tmp/phase8-results.zip
          echo '3bb581b4b104f29e836d4cdbce0cb519727466c8df17e408c3595e1e5744300c  /tmp/phase8-results.zip' | sha256sum --check
          rm -rf /tmp/phase8-results
          mkdir -p /tmp/phase8-results
          unzip -q /tmp/phase8-results.zip -d /tmp/phase8-results
          cd /tmp/phase8-results/phase8-formal
          sha256sum --check SHA256SUMS
          expected=(
            SHA256SUMS
            phase8_runs.csv
            phase8_causal.csv
            phase8_summary.csv
            phase8_paired.csv
            phase8_causal_comparisons.csv
            phase8_retention.csv
            phase8_manifest.json
          )
          for file in "${expected[@]}"; do test -f "$file"; done
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 8
      - name: Commit verified consolidated results
        shell: bash
        run: |
          set -euo pipefail
          rm -rf results/phase8-formal
          mkdir -p results
          cp -a /tmp/phase8-results/phase8-formal results/phase8-formal
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f results/phase8-formal
          if git diff --cached --quiet; then
            echo 'No formal result changes to commit.' >&2
            exit 1
          fi
          git commit -m 'results: record Phase 8 formal experiment'
          git push origin HEAD:agent/phase8-retention-eviction
