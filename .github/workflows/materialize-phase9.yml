name: Materialize Phase 9 Source

on:
  pull_request:
    branches: [agent/phase8-retention-eviction]

permissions:
  contents: write

concurrency:
  group: materialize-phase9-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.head_ref == 'agent/phase9-delayed-utility'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase9-delayed-utility
          fetch-depth: 0
      - name: Reassemble and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .phase9-bootstrap/part-00 \
            .phase9-bootstrap/part-01 \
            .phase9-bootstrap/part-02-0 \
            .phase9-bootstrap/part-02-1 \
            .phase9-bootstrap/part-03-0 \
            .phase9-bootstrap/part-03-1 \
            .phase9-bootstrap/part-04-0 \
            .phase9-bootstrap/part-04-1 \
            .phase9-bootstrap/part-05 \
            > /tmp/phase9.patch.gz.b64
          echo '064eaed29db1be58f032e5c0afdd9fbe52a4b80586e2680247bb1280fea22699  /tmp/phase9.patch.gz.b64' | sha256sum --check
          base64 --decode /tmp/phase9.patch.gz.b64 > /tmp/phase9.patch.gz
          echo '4c91dacbdf14371977ae96fed41e1836f7eb7be5e5bd89fa222d839fdd88d886  /tmp/phase9.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/phase9.patch.gz > /tmp/phase9.patch
          echo '4df199860c6ffee5d822a25e3d897f310c09baaed4a2583a934c4fe49519e14b  /tmp/phase9.patch' | sha256sum --check
          git apply --check /tmp/phase9.patch
      - name: Apply and commit verified source
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/phase9.patch
          rm -f .github/workflows/phase9-experiments.yml
          rm -rf .phase9-bootstrap
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add Phase 9 delayed utility experiments'
          git push origin HEAD:agent/phase9-delayed-utility
