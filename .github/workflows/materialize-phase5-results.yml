name: Materialize Phase 5 Results

on:
  pull_request:
    branches: [agent/phase4-mediation]

permissions:
  contents: write

concurrency:
  group: materialize-phase5-results-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.head_ref == 'agent/phase5-calibration'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase5-calibration
          fetch-depth: 0
      - name: Download and verify formal artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            https://api.github.com/repos/valurius38027/ESM/actions/artifacts/8364540867/zip \
            --output /tmp/phase5-results.zip
          echo '104adf7dd4e520e464876bd8ab72c1320a89197245fc74eca6ca1b8e164b1825  /tmp/phase5-results.zip' | sha256sum --check
          rm -rf /tmp/phase5-results
          mkdir -p /tmp/phase5-results
          unzip -q /tmp/phase5-results.zip -d /tmp/phase5-results
          cd /tmp/phase5-results/phase5-formal
          sha256sum --check SHA256SUMS
          expected=(
            SHA256SUMS
            phase5_runs.csv
            phase5_causal.csv
            phase5_summary.csv
            phase5_paired.csv
            phase5_causal_comparisons.csv
            phase5_calibration.csv
            phase5_routing.csv
            phase5_manifest.json
          )
          for file in "${expected[@]}"; do test -f "$file"; done
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 9
      - name: Commit verified consolidated results
        shell: bash
        run: |
          set -euo pipefail
          rm -rf results/phase5-formal
          mkdir -p results
          cp -a /tmp/phase5-results/phase5-formal results/phase5-formal
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f results/phase5-formal
          if git diff --cached --quiet; then
            echo 'No formal result changes to commit.' >&2
            exit 1
          fi
          git commit -m 'results: record Phase 5 formal experiment'
          git push origin HEAD:agent/phase5-calibration
