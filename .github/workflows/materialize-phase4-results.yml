name: Materialize Phase 4 Results

on:
  pull_request:
    branches: [agent/phase3-credit-assignment]

permissions:
  actions: read
  contents: write

concurrency:
  group: materialize-phase4-results-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.head_ref == 'agent/phase4-mediation'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase4-mediation
          fetch-depth: 0
      - name: Download and verify formal artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output /tmp/phase4-formal-results.zip \
            'https://api.github.com/repos/valurius38027/ESM/actions/artifacts/8355482053/zip'
          echo '7007a370b7b44d7a8c8f2cdd75d5987029daa7d70782ac8047b4cd39e982e081  /tmp/phase4-formal-results.zip' | sha256sum --check
          rm -rf /tmp/phase4-artifact
          mkdir -p /tmp/phase4-artifact
          unzip -q /tmp/phase4-formal-results.zip -d /tmp/phase4-artifact
          cd /tmp/phase4-artifact/phase4-formal
          sha256sum --check SHA256SUMS
          cd "${GITHUB_WORKSPACE}"
          rm -rf results/phase4-formal
          mkdir -p results/phase4-formal
          cp -a /tmp/phase4-artifact/phase4-formal/. results/phase4-formal/
      - name: Commit verified consolidated results
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f results/phase4-formal
          if git diff --cached --quiet; then
            echo 'No Phase 4 result changes to commit.' >&2
            exit 1
          fi
          git commit -m 'results: add phase 4 formal artifact'
          git push origin HEAD:agent/phase4-mediation
