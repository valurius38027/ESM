name: Materialize Phase 9 Report

on:
  pull_request:
    branches: [agent/phase8-retention-eviction]

permissions:
  contents: write

jobs:
  materialize:
    if: github.head_ref == 'agent/phase9-delayed-utility'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase9-delayed-utility
          fetch-depth: 0
      - name: Reassemble and verify report patch
        shell: bash
        run: |
          set -euo pipefail
          cat .phase9-report-bootstrap/part-00 \
              .phase9-report-bootstrap/part-01 \
              .phase9-report-bootstrap/part-02 \
              > /tmp/phase9-report.patch.gz.b64
          echo 'd9533a3a80c78e678c95cd1068e0503b837644b131c57527b4a2c487c23c22f8  /tmp/phase9-report.patch.gz.b64' | sha256sum --check
          base64 --decode /tmp/phase9-report.patch.gz.b64 > /tmp/phase9-report.patch.gz
          echo 'b60bddfc23c63ae356cad5e6422907765c3fca31855548dea10af33396234bc8  /tmp/phase9-report.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/phase9-report.patch.gz > /tmp/phase9-report.patch
          echo 'b2d0a6b6665a1c100e53f3d31676e966426277b570acc2b6673a9d1e34ba8735  /tmp/phase9-report.patch' | sha256sum --check
          git apply --check /tmp/phase9-report.patch
      - name: Apply and commit report
        shell: bash
        run: |
          set -euo pipefail
          git apply /tmp/phase9-report.patch
          rm -rf .phase9-report-bootstrap
          cd results/phase9-formal
          sha256sum --check SHA256SUMS
          cd ../..
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'results: add Phase 9 validation and independent verification'
          git push origin HEAD:agent/phase9-delayed-utility
