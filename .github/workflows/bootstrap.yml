name: Materialize Source

on:
  push:
    branches: [agent/phase2-experimental-controls]

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct large source files
        run: |
          cat .bootstrap/model.part-* > src/model.cpp
          echo 'ba7717d5f6779aaedff421ad5f701a7e2a68468747d5270199ec2dc3e05385d5  src/model.cpp' | sha256sum --check
          cat .bootstrap/aggregate.part-* > scripts/aggregate_phase2.py
          echo 'cc4804889956cc34482c2cad91eddcec9dcf6e0d85b4754ea93265d1dad00807  scripts/aggregate_phase2.py' | sha256sum --check
          chmod +x scripts/aggregate_phase2.py
      - name: Commit materialized source
        run: |
          rm -rf .bootstrap .github/workflows/bootstrap.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'feat: materialize SGW-ESM source'
          git push origin HEAD
