name: Materialize Phase 5 Source

on:
  pull_request:
    branches: [agent/phase4-mediation]

permissions:
  contents: write

concurrency:
  group: materialize-phase5-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    if: github.head_ref == 'agent/phase5-calibration'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/phase5-calibration
          fetch-depth: 0
      - name: Reassemble and verify Phase 5 patch
        shell: bash
        run: |
          set -euo pipefail
          cat .phase5-bootstrap/part-00 \
              .phase5-bootstrap/part-01 \
              .phase5-bootstrap/part-02 \
              .phase5-bootstrap/part-03 \
              .phase5-bootstrap/part-04 \
              .phase5-bootstrap/part-05 \
              .phase5-bootstrap/part-06 > /tmp/phase5.patch.gz.b64
          echo 'ef9aa46c7efa32ee4f8c0b6d203acb6cf10fdb05f28fdc51ac1b91bbe8f548e3  /tmp/phase5.patch.gz.b64' | sha256sum --check
          base64 --decode /tmp/phase5.patch.gz.b64 > /tmp/phase5.patch.gz
          echo '480306fb36545c244cc87842e5f5b5c3b3ce9a9be3dd050632676d1a4c26be3f  /tmp/phase5.patch.gz' | sha256sum --check
          gzip -dc /tmp/phase5.patch.gz > /tmp/phase5.patch
          echo 'b8899a2f25c760c0dc47f0445f1f777290bbbb02c81fb733b293296bcba4d8d3  /tmp/phase5.patch' | sha256sum --check
          git apply --check /tmp/phase5.patch
          git apply /tmp/phase5.patch
      - name: Commit materialized Phase 5 source
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .phase5-bootstrap
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Materialization produced no changes.' >&2
            exit 1
          fi
          git commit -m 'feat: add phase 5 structural calibration experiments'
          git push origin HEAD:agent/phase5-calibration
